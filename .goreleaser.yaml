# goreleaser configuration for Cairn.
version: 2

before:
  hooks:
    # Hermetic: verify the module cache matches go.sum instead of mutating
    # go.mod/go.sum at release time (`go mod tidy` would make releases
    # non-reproducible from a clean checkout).
    - go mod download
    - go mod verify

builds:
  - id: cairn
    main: ./cmd/cairn
    binary: cairn
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # CommitDate (not the build clock) keeps release builds reproducible.
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/nickpdawson/cairn-mdm/internal/version.Version={{.Version}}
      - -X github.com/nickpdawson/cairn-mdm/internal/version.Commit={{.ShortCommit}}
      - -X github.com/nickpdawson/cairn-mdm/internal/version.Date={{.CommitDate}}
    goos:
      - freebsd
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md
      - src: packaging/cairn.example.toml
        dst: cairn.example.toml
      - src: packaging/systemd/cairn.service
        dst: contrib/systemd/cairn.service
      - src: packaging/rc.d/cairn
        dst: contrib/rc.d/cairn

# Linux packages (deb/rpm) install the binary + systemd unit + example config.
nfpms:
  - id: cairn
    package_name: cairn
    maintainer: DZsec <security@dzsec.net>
    description: Single-binary Apple MDM server.
    license: MIT
    homepage: https://github.com/nickpdawson/cairn-mdm
    formats:
      - deb
      - rpm
    bindir: /usr/local/bin
    contents:
      - src: packaging/systemd/cairn.service
        dst: /lib/systemd/system/cairn.service
      - src: packaging/cairn.example.toml
        dst: /etc/cairn/cairn.example.toml
        type: config
    # A dedicated system user owns the data dir.
    scripts:
      preinstall: packaging/scripts/preinstall.sh

dockers:
  - id: versioned
    image_templates:
      - "ghcr.io/nickpdawson/cairn-mdm:{{ .Version }}"
    dockerfile: packaging/Dockerfile.goreleaser
    build_flag_templates:
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.source=https://github.com/nickpdawson/cairn-mdm"
  # The latest tag follows full releases only: a prerelease tag such as
  # v0.2.0-beta.1 is not pushed here.
  - id: latest
    image_templates:
      - "ghcr.io/nickpdawson/cairn-mdm:latest"
    skip_push: auto
    dockerfile: packaging/Dockerfile.goreleaser
    build_flag_templates:
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.source=https://github.com/nickpdawson/cairn-mdm"

# A tag with a prerelease part becomes a GitHub prerelease, which the
# installer's "latest" lookup skips.
release:
  prerelease: auto

checksum:
  name_template: "checksums.txt"

sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github

<!doctype html>
<html lang="en">
<head>{{template "head" .}}</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <span class="wordmark">▲ <span class="peak">Cairn</span></span>
      <h1 class="sr-only">Sign in to Cairn</h1>
      <div class="tagline">Device management, quietly.</div>
      {{if .Error}}<div class="form-error">{{.Error}}</div>{{end}}
      {{if .SetupOpen}}<div class="callout" style="text-align:left">No administrator exists yet. <a href="/setup">Run first-time setup</a> with the token from the Cairn host.</div>{{end}}
      <form method="post" action="/login">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" autofocus value="{{.Username}}">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password">
        <button class="btn" type="submit">Sign in</button>
      </form>
      {{if oidcEnabled}}
      <div class="login-sso">
        <a class="btn link" href="/auth/oidc/login">Sign in with SSO</a>
      </div>
      {{end}}
    </div>
  </div>
</body>
</html>
